<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="Live Infinite Flight flight tracker">
<title>Infinite Flight Tracker</title>
<link rel="stylesheet" href="styles.css">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
</head>
<body>
<header class="topbar">
  <div class="brand">
    <strong>✈ Infinite Flight Tracker</strong>
    <span id="status" class="status">Connecting…</span>
  </div>

  <div class="top-controls">
    <div class="server-picker" aria-label="Infinite Flight server">
      <button class="server-btn" data-server="casual">Casual</button>
      <button class="server-btn" data-server="training">Training</button>
      <button class="server-btn active" data-server="expert">Expert</button>
    </div>
    <button id="airportsToggle" class="top-btn">Airports</button>
    <button id="airportBtn" class="top-btn">✈ Airport</button>
    <button id="fitBtn" class="top-btn">Fit</button>
  </div>
</header>

<main>
  <section id="map" aria-label="Live aircraft map"></section>

  <aside id="panel">
    <div class="panel-head">
      <div>
        <h2>Live flights</h2>
        <div id="summary">Waiting for live data…</div>
      </div>
      <button id="refreshBtn" class="icon-btn" title="Refresh now">↻</button>
    </div>

    <div class="server-status">
      <b id="serverLabelMirror">Expert</b>
      <span> · </span><span id="serverCounts">—</span> flights
      <span id="airportCount"> · Airports off</span>
    </div>

    <div class="search-row"><input id="search" autocomplete="off" placeholder="Search flight"><button id="searchBtn">Go</button></div>
<button id="filtersBtn" class="simple-settings">Filters</button>
<div id="filtersBox" class="filter-box hidden">
<div class="quick-filters"><button class="filter-chip active" data-phase="all">All</button><button class="filter-chip" data-phase="ground">Ground</button><button class="filter-chip" data-phase="air">Air</button></div>
<div class="filter-grid"><input id="aircraftFilter" placeholder="Plane"><input id="airportFilter" maxlength="4" placeholder="Airport"><input id="minAlt" inputmode="numeric" placeholder="Min height"><input id="maxAlt" inputmode="numeric" placeholder="Max height"><button id="resetBtn">Clear</button></div>
</div>

    <div id="airportSearch" class="airport-search hidden">
      <input id="airportInput" maxlength="4" autocomplete="off" placeholder="ICAO airport, e.g. LTFM">
      <button id="airportGo">Open airport</button>
    </div>

    <div id="error" class="error hidden"></div>
    <div id="details" class="empty">Select an aircraft on the map.</div>
    <div id="airportPanel" class="airport-panel hidden"></div>
  </aside>
</main>

<footer>
  <span>Live data from Infinite Flight Live API · © OpenStreetMap contributors</span>
  <span id="updated">Not updated yet</span>
</footer>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="app.js"></script>
</body>
</html>
