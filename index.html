<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Infinite Flight Tracker</title>
<link rel="stylesheet" href="styles.css">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
</head>
<body>
<header class="topbar">
  <div><strong>✈ Infinite Flight Tracker</strong><span id="status">Connecting…</span></div>
  <div class="controls">
    <input id="search" placeholder="Search callsign, username or flight ID">
    <button id="searchBtn">Search</button>
    <button id="resetBtn">Show all</button>
  </div>
</header>
<main>
  <section id="map"></section>
  <aside id="panel">
    <h2>Live flights</h2>
    <div id="summary">Loading…</div>
    <div id="details">Select an aircraft on the map.</div>
  </aside>
</main>
<footer>Live data • Infinite Flight Live API • Updates no faster than the permitted API cadence</footer>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="app.js"></script>
</body>
</html>
